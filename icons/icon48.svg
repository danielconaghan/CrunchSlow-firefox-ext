<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Dark background -->
  <circle cx="24" cy="24" r="23" fill="#1a1a2e"/>
  <!-- Orange outer ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#F47521" stroke-width="2.5"/>
  <!-- Speed arc (partial circle suggesting a gauge) -->
  <path d="M 10 30 A 16 16 0 0 1 38 30" fill="none" stroke="#F47521" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- Active arc (left portion = slow speed) -->
  <path d="M 10 30 A 16 16 0 0 1 24 14" fill="none" stroke="#F47521" stroke-width="3" stroke-linecap="round"/>
  <!-- Needle -->
  <line x1="24" y1="26" x2="14" y2="17" stroke="#F47521" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="24" cy="26" r="3" fill="#F47521"/>
</svg>
